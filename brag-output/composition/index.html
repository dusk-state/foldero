<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Foldero — brag video</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0d10;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #0b0d10;
        font-family: Oswald, sans-serif;
      }
      .clip {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mono {
        font-family: "JetBrains Mono", monospace;
      }
      .accent-line {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 3px;
        background: linear-gradient(90deg, #3fc6ff, #9b5cff);
        border-radius: 2px;
      }

      /* ---- Scene 1: chaos hook ---- */
      #scene-1 .glyph {
        position: absolute;
        width: 64px;
        height: 52px;
        border-radius: 4px;
        background: #3a3d42;
        border: 2px solid #55585e;
      }
      #scene-1 .caption {
        position: absolute;
        bottom: 200px;
        color: #d4d6da;
        font-size: 54px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      /* ---- Scene 2: terminal reveal ---- */
      #scene-2 .terminal-window {
        width: 1040px;
        border-radius: 14px;
        overflow: hidden;
        background: #101318;
        border: 1px solid #24272e;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.55);
      }
      #scene-2 .chrome {
        height: 44px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        background: #14171d;
        border-bottom: 1px solid #24272e;
      }
      #scene-2 .dot {
        width: 11px;
        height: 11px;
        border-radius: 999px;
        background: #4a4d54;
      }
      #scene-2 .term-body {
        padding: 44px 40px 56px;
        min-height: 220px;
        font-size: 40px;
        color: #3fc6ff;
      }
      #scene-2 .prompt {
        color: #6b7076;
      }
      #scene-2 .cursor {
        display: inline-block;
        width: 20px;
        height: 40px;
        background: #3fc6ff;
        margin-left: 4px;
        transform: translateY(6px);
      }

      /* ---- Scene 3: gradient sweep reorg ---- */
      #scene-3 .grid-wrap {
        position: relative;
        width: 1280px;
        height: 620px;
      }
      #scene-3 .cell {
        position: absolute;
        width: 220px;
        height: 130px;
        border-radius: 10px;
        background: #14171d;
        border: 1px solid #262a31;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "JetBrains Mono", monospace;
        font-size: 26px;
        color: #cfe9ff;
      }
      #scene-3 .sweep {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 420px;
        background: linear-gradient(135deg, #3fc6ff, #9b5cff);
        opacity: 0.85;
        filter: blur(2px);
        mix-blend-mode: screen;
      }
      #scene-3 .caption {
        position: absolute;
        top: 130px;
        color: #d4d6da;
        font-size: 54px;
        font-weight: 500;
      }

      /* ---- Scene 4: stat block ---- */
      #scene-4 .stat {
        font-family: "JetBrains Mono", monospace;
        font-size: 96px;
        font-weight: 700;
        background: linear-gradient(135deg, #3fc6ff, #9b5cff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: -0.01em;
      }
      #scene-4 .sub {
        margin-top: 28px;
        color: #9aa0a8;
        font-size: 40px;
        font-weight: 500;
      }
      #scene-4 .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* ---- Scene 5: tagline card ---- */
      #scene-5 .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
      }
      #scene-5 .tagline {
        color: #f4f5f6;
        font-size: 68px;
        font-weight: 600;
        letter-spacing: -0.02em;
        max-width: 1200px;
        text-align: center;
      }

      /* ---- Scene 6: outro wordmark ---- */
      #scene-6 .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      #scene-6 .wordmark {
        color: #f4f5f6;
        font-size: 104px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      #scene-6 .cmd {
        font-family: "JetBrains Mono", monospace;
        font-size: 36px;
        color: #7fd4ff;
      }
      #scene-6 .cmd .cursor {
        display: inline-block;
        width: 16px;
        height: 32px;
        background: #7fd4ff;
        margin-left: 4px;
        transform: translateY(6px);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="foldero-brag"
      data-start="0"
      data-duration="18"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene 1: 0.0-2.5s — chaos -->
      <section id="scene-1" class="clip" data-start="0" data-duration="2.5" data-track-index="0">
        <div id="glyphs"></div>
        <div class="caption">Your folders are a mess.</div>
      </section>

      <!-- Scene 2: 2.5-5.5s — terminal reveal -->
      <section id="scene-2" class="clip" data-start="2.5" data-duration="3" data-track-index="0">
        <div class="terminal-window">
          <div class="chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          <div class="term-body mono">
            <span class="prompt">$&nbsp;</span><span id="typed-cmd"></span><span id="term-cursor" class="cursor"></span>
          </div>
        </div>
      </section>

      <!-- Scene 3: 5.5-9.5s — gradient sweep reorg -->
      <section id="scene-3" class="clip" data-start="5.5" data-duration="4" data-track-index="0">
        <div class="grid-wrap" id="grid-wrap">
          <div class="sweep" id="sweep"></div>
        </div>
        <div class="caption" id="s3-caption">Audits. Plans. Executes.</div>
      </section>

      <!-- Scene 4: 9.5-13s — stat block -->
      <section id="scene-4" class="clip" data-start="9.5" data-duration="3.5" data-track-index="0">
        <div class="stack">
          <div class="stat" id="stat-line">21 skills · 6 guarantees</div>
          <div class="sub" id="stat-sub">Never deletes. Every move verified.</div>
        </div>
      </section>

      <!-- Scene 5: 13-16s — tagline card -->
      <section id="scene-5" class="clip" data-start="13" data-duration="3" data-track-index="0">
        <div class="stack">
          <div class="accent-line" id="s5-line" style="position: static; transform: none"></div>
          <div class="tagline" id="s5-tagline">Take control of any folder tree.</div>
        </div>
      </section>

      <!-- Scene 6: 16-18s — outro wordmark -->
      <section id="scene-6" class="clip" data-start="16" data-duration="2" data-track-index="0">
        <div class="stack">
          <div class="wordmark" id="s6-wordmark">Foldero</div>
          <div class="cmd mono"><span>/foldero</span><span id="s6-cursor" class="cursor"></span></div>
        </div>
      </section>

      <audio id="sfx-keystroke" src=".media/audio/sfx/sfx_001.mp3"></audio>
      <audio id="sfx-chime" src=".media/audio/sfx/sfx_002.mp3"></audio>
      <audio id="sfx-logo-hit" src=".media/audio/sfx/sfx_002.mp3"></audio>
    </div>
    <script>
      const glyphsRoot = document.getElementById("glyphs");
      const glyphSpots = [
        [220, 140],
        [520, 620],
        [860, 220],
        [1180, 560],
        [1480, 300],
        [1640, 700],
        [340, 780],
        [980, 780],
        [1720, 160],
        [120, 460],
        [700, 460],
        [1380, 460],
      ];
      glyphSpots.forEach(([x, y], i) => {
        const g = document.createElement("div");
        g.className = "glyph";
        g.style.left = x + "px";
        g.style.top = y + "px";
        g.dataset.idx = i;
        glyphsRoot.appendChild(g);
      });

      const gridWrap = document.getElementById("grid-wrap");
      const gridLabels = ["00. Inbox", "1. Personal", "2. Work", "3. Knowledge", "4. System", "99. Archive", "5. Client A", "6. Media", "7. Docs"];
      const cols = 3;
      const cellW = 240;
      const cellH = 150;
      gridLabels.forEach((label, i) => {
        const c = document.createElement("div");
        c.className = "cell";
        c.textContent = label;
        const col = i % cols;
        const row = Math.floor(i / cols);
        c.style.left = col * cellW + "px";
        c.style.top = row * cellH + "px";
        gridWrap.appendChild(c);
      });
      document.getElementById("sweep").style.left = "-420px";

      const tl = gsap.timeline({ paused: true });

      // Scene 1 (0 - 2.5s): chaos drift, muted grey
      tl.fromTo(
        "#scene-1 .glyph",
        { opacity: 0, rotate: () => gsap.utils.random(-18, 18) },
        { opacity: 1, duration: 0.4, stagger: 0.03, ease: "power1.out" },
        0.05
      );
      tl.to(
        "#scene-1 .glyph",
        {
          x: () => gsap.utils.random(-30, 30),
          y: () => gsap.utils.random(-20, 20),
          rotate: () => gsap.utils.random(-10, 10),
          duration: 2.1,
          ease: "sine.inOut",
        },
        0.1
      );
      tl.fromTo("#scene-1 .caption", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.3);

      // Scene 2 (2.5 - 5.5s): terminal reveal, keystroke type-out
      const cmdText = "/foldero";
      tl.fromTo("#scene-2 .terminal-window", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 2.5);
      const typeStart = 2.95;
      const perChar = 0.09;
      cmdText.split("").forEach((_, i) => {
        tl.call(
          () => {
            document.getElementById("typed-cmd").textContent = cmdText.slice(0, i + 1);
          },
          [],
          typeStart + i * perChar
        );
        tl.call(
          () => {
            document.getElementById("sfx-keystroke").currentTime = 0;
            document.getElementById("sfx-keystroke").play();
          },
          [],
          typeStart + i * perChar
        );
      });
      tl.to("#term-cursor", { opacity: 0, duration: 0.18, repeat: 5, yoyo: true, ease: "none" }, 2.5);

      // Scene 3 (5.5 - 9.5s): gradient sweep reorganises the grid
      tl.fromTo("#scene-3 .cell", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, stagger: 0.02, ease: "power2.out" }, 5.6);
      tl.fromTo("#sweep", { x: 0 }, { x: 1700, duration: 1.6, ease: "power2.inOut" }, 6.1);
      tl.call(
        () => {
          document.getElementById("sfx-chime").currentTime = 0;
          document.getElementById("sfx-chime").play();
        },
        [],
        6.1
      );
      tl.fromTo(
        "#s3-caption",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        7.9
      );

      // Scene 4 (9.5 - 13s): stat block settles
      tl.fromTo("#stat-line", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 9.6);
      tl.fromTo("#stat-sub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 10.0);

      // Scene 5 (13 - 16s): tagline card
      tl.fromTo("#s5-line", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "power2.out" }, 13.1);
      tl.fromTo("#s5-tagline", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 13.35);

      // Scene 6 (16 - 18s): outro wordmark + cmd, cursor blinks once, logo hit
      tl.fromTo("#s6-wordmark", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 16.1);
      tl.fromTo("#s6-wordmark ~ .cmd", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 16.4);
      tl.call(
        () => {
          document.getElementById("sfx-logo-hit").currentTime = 0;
          document.getElementById("sfx-logo-hit").play();
        },
        [],
        16.1
      );
      tl.to("#s6-cursor", { opacity: 0, duration: 0.25, repeat: 1, yoyo: true, ease: "none" }, 16.7);
      tl.to("#root", { opacity: 0, duration: 0.4, ease: "power1.in" }, 17.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["foldero-brag"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
